[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "0.1.0"
description = "A small, unified CLI for OpenAI and Gemini APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.20",
    "httpx>=0.28",
    "openai>=3.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai = "ai_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
